<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload File</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 80px; }
    </style>
</head>
<body>
    <h1>Upload File to Server</h1>
    
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <p style="color: green; font-size: 18px;">{{ message }}</p>
        {% endfor %}
      {% endif %}
    {% endwith %}
    
    <form method="post" enctype="multipart/form-data">
        <input type="file" name="file" style="margin:20px; font-size:16px;">
        <br><br>
        <input type="submit" value="Upload File" 
               style="padding:12px 25px; font-size:18px; cursor:pointer;">
    </form>
    <br>
    <a href="/">← Back to Home</a>
</body>
</html>
